name: OnePlus13

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  # 缓存 key：缓存命中即完全复用（跳过下载+编译内核），只重编 pte_driver.ko。
  # 若需强制重编（例如改驱动代码想重新编译内核），改这个值或手动清 cache 再跑。
  CCACHE_KEY: ccache-neov4-6.6.118

on:
  workflow_dispatch:

jobs:
  build_pte_driver:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # 0. 显式 checkout 仓库（含 pte_driver 源码），放在 workspace 顶层
      - name: Checkout 仓库
        uses: actions/checkout@v4

      # 1. 恢复缓存（包含已编译的 kernel_workspace/out + clang18 + build-tools）
      - name: 恢复缓存
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: kernel_workspace
          key: pte-cache-${{ env.CCACHE_KEY }}

      # 1.5 安装编译依赖（无论缓存是否命中都执行，因为 runner 每次都是全新环境）
      - name: 安装编译依赖
        run: |
          sudo apt update >/dev/null 2>&1
          sudo apt-get install -y --no-install-recommends ccache libelf-dev libssl-dev binutils python-is-python3 >/dev/null 2>&1 || true
          ccache --version >/dev/null 2>&1 && echo "ccache OK" || echo "ccache MISSING"

      # 2. 下载 GKI common 源码 + clang18 + build-tools（缓存命中时自动跳过）
      - name: 初始化并下载内核源码及工具链
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118.zip -o common.zip &&
          unzip -q common.zip &&
          mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_b_16.0.0_oneplus_13_6.6.118" common &&
          rm -rf common.zip &

          echo "正在克隆llvm-clang18工具链..." &&
          mkdir -p clang18 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&
          unzip -q clang.zip -d clang18 &&
          rm -rf clang.zip &

          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &

          wait
          echo "所有源码及工具链初始化完成！"
          # 去除 ABI 保护 & 去除 dirty 后缀
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      # 3. 配置 gki_defconfig（缓存命中时自动跳过）
      - name: gki_defconfig 配置
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/build-tools/bin:$PATH"
          cd kernel_workspace/common
          # 设置与设备一致的 LOCALVERSION（确保 .ko vermagic 精确匹配设备内核）
          echo "CONFIG_LOCALVERSION=\"-android15-8-g29d86c5fc9dd-abogki428889875-4k\"" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./arch/arm64/configs/gki_defconfig
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig

      # 4. 编译完整 GKI 内核（缓存命中时自动跳过；生成 out/Module.symvers 确保 .ko 符号匹配）
      - name: 编译内核
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/build-tools/bin:$PATH"
          cd kernel_workspace/common
          # 编译内核镜像
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          # 内核构建实际把导出符号写进了 vmlinux.symvers，
          # 编译外部模块（M=...）时 modpost 读的是 out/Module.symvers，
          # 故将 vmlinux.symvers 复制为 Module.symvers（含全部内核导出符号+CRC，CFI 环境必需）。
          cp -f out/vmlinux.symvers out/Module.symvers
          echo "=== 确认 Module.symvers 已生成 ==="
          ls -la out/vmlinux.symvers out/Module.symvers 2>&1

      # 5. 保存缓存（仅在本次真正编译过硬核后保存/更新）
      - name: 保存缓存
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel_workspace
          key: pte-cache-${{ env.CCACHE_KEY }}

      # 6. 编译 pte_driver 独立模块 (.ko) —— 每次都会执行
      # 关键：M= 模块目录必须放在内核树(kernel_workspace/common)之外，
      #       否则 kbuild 无法为 .ko 生成链接规则，报 "No rule to make target X.ko"
      - name: 编译 pte_driver 独立模块 (.ko)
        run: |
          echo "=== 准备模块编译环境 ==="
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/build-tools/build-tools/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          # 模块源码放内核树外：$GITHUB_WORKSPACE/pte_driver_mod（绝对路径）
          rm -rf $GITHUB_WORKSPACE/pte_driver_mod
          cp -r $GITHUB_WORKSPACE/pte_driver $GITHUB_WORKSPACE/pte_driver_mod
          # pipefail：让 make 的真实失败码被 step 捕获（否则 run 会假成功）
          set -o pipefail
          echo "=== 编译 pte_driver.ko ==="
          make -C $GITHUB_WORKSPACE/kernel_workspace/common LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld KCFLAGS+=-O2 KCFLAGS+=-Wno-error O=out M=$GITHUB_WORKSPACE/pte_driver_mod modules 2>&1 | tee /tmp/mod_build.log
          echo "=== make 退出码管道处理 ==="
          echo "=== 完整 make 输出 ==="
          cat /tmp/mod_build.log
          echo "=== M目录全部文件 ==="
          ls -la $GITHUB_WORKSPACE/pte_driver_mod/ 2>&1
          echo "=== M目录 .mod / .mod.c / modules.order / .ko ==="
          find $GITHUB_WORKSPACE/pte_driver_mod \( -name '*.ko' -o -name '*.mod' -o -name '*.mod.c' -o -name 'modules.order' -o -name 'Module.symvers' \) 2>&1
          echo "=== DIAG out 下 pte_driver_mod (obj 错位检查) ==="
          find $GITHUB_WORKSPACE/kernel_workspace/common/out \( -path '*pte_driver_mod*' -o -name '*.mod.c' -o -name '*.mod.o' \) 2>/dev/null | head -20
          echo "=== DIAG out/modules.order 内容 ==="
          cat $GITHUB_WORKSPACE/kernel_workspace/common/out/modules.order 2>&1 | head -20
          echo "=== DIAG out/.tmp_versions ==="
          ls -la $GITHUB_WORKSPACE/kernel_workspace/common/out/.tmp_versions 2>&1 | head -10
          echo "=== DIAG M/.tmp_versions ==="
          ls -la $GITHUB_WORKSPACE/pte_driver_mod/.tmp_versions 2>&1 | head -10
          echo "=== DIAG M 下 .mod.c/.mod.o ==="
          ls -la $GITHUB_WORKSPACE/pte_driver_mod/*.mod.c $GITHUB_WORKSPACE/pte_driver_mod/*.mod.o $GITHUB_WORKSPACE/pte_driver_mod/*.mod 2>&1
          echo "=== out/scripts/module.lds ==="
          ls -la $GITHUB_WORKSPACE/kernel_workspace/common/out/scripts/module.lds 2>&1
          cp -f $GITHUB_WORKSPACE/pte_driver_mod/pte_driver.ko $GITHUB_WORKSPACE/ 2>/dev/null || true

      # 7. 上传 pte_driver.ko
      - name: 上传 pte_driver.ko
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pte_driver_ko
          path: $GITHUB_WORKSPACE/pte_driver*.ko
