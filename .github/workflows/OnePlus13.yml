name: OnePlus13

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  CCACHE_KEY: ccache-neov4-6.6.118

on:
  workflow_dispatch:

jobs:
  build_pte_driver:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # 0. 显式 checkout 仓库（含 pte_driver 源码），放在 workspace 顶层
      - name: Checkout 仓库
        uses: actions/checkout@v4

      # 1. 下载 GKI common 源码 + clang18 + build-tools（与设备内核 6.6.118 完全一致的环境）
      - name: 初始化并下载内核源码及工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          # 安装编译依赖（gki_defconfig/内核编译必需）
          sudo apt update >/dev/null 2>&1
          sudo apt-get install -y --no-install-recommends ccache libelf-dev libssl-dev binutils python-is-python3 >/dev/null 2>&1 || true

          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118.zip -o common.zip &&
          unzip -q common.zip &&
          mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_b_16.0.0_oneplus_13_6.6.118" common &&
          rm -rf common.zip &

          echo "正在克隆llvm-clang18工具链..." &&
          mkdir -p clang18 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip &&
          unzip -q clang.zip -d clang18 &&
          rm -rf clang.zip &

          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &

          wait
          echo "所有源码及工具链初始化完成！"
          # 去除 ABI 保护 & 去除 dirty 后缀
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      # 2. 配置 gki_defconfig（生成与设备 GKI 内核完全匹配的构建环境）
      - name: gki_defconfig 配置
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace/common
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig

      # 3. 编译完整 GKI 内核（生成完整 Module.symvers，确保 .ko 符号版本与设备一致）
      - name: 编译内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          cd kernel_workspace/common
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

      # 4. 编译 pte_driver 独立模块 (.ko)
      - name: 编译 pte_driver 独立模块 (.ko)
        run: |
          cd kernel_workspace/common
          echo "=== 准备模块编译环境 ==="
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/build-tools/build-tools/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          # 复制 pte_driver 源码到内核树内（仓库默认 checkout 在 $GITHUB_WORKSPACE）
          cp -r $GITHUB_WORKSPACE/pte_driver ./pte_driver_mod
          echo "=== 编译 pte_driver.ko ==="
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld KCFLAGS+=-O2 KCFLAGS+=-Wno-error O=out M=$(pwd)/pte_driver_mod modules 2>&1 | tail -30
          echo "=== 产物检查 ==="
          ls -la ./pte_driver_mod/*.ko 2>&1
          cp -f ./pte_driver_mod/pte_driver.ko $GITHUB_WORKSPACE/ 2>/dev/null || true

      # 5. 上传 pte_driver.ko
      - name: 上传 pte_driver.ko
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pte_driver_ko
          path: $GITHUB_WORKSPACE/pte_driver*.ko