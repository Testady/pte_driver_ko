name: OnePlus13

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  # 缓存 key：缓存命中即完全复用（跳过下载+编译内核），只重编 pte_driver.ko。
  # v2: 强制缓存失效, 在已装dwarves(pahole)的环境下完整重编内核, 生成 vmlinux 的 .BTF, 使模块带 .BTF 段(对齐paradise)
  CCACHE_KEY: ccache-device-config-v2

on:
  workflow_dispatch:

jobs:
  build_pte_driver:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # 0. 显式 checkout 仓库（含 pte_driver 源码），放在 workspace 顶层
      - name: Checkout 仓库
        uses: actions/checkout@v4

      # 1. 恢复缓存（包含已编译的 kernel_workspace/out + clang18 + build-tools）
      - name: 恢复缓存
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: kernel_workspace
          key: pte-cache-${{ env.CCACHE_KEY }}

      # 1.5 安装编译依赖（无论缓存是否命中都执行，因为 runner 每次都是全新环境）
      - name: 安装编译依赖
        run: |
          sudo apt update >/dev/null 2>&1
          sudo apt-get install -y --no-install-recommends ccache libelf-dev libssl-dev binutils python-is-python3 dwarves >/dev/null 2>&1 || true
          ccache --version >/dev/null 2>&1 && echo "ccache OK" || echo "ccache MISSING"

      # 2. 下载 GKI common 源码 + clang18 + build-tools（缓存命中时自动跳过）
      - name: 初始化并下载内核源码及工具链
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          # 带自动重试的下载函数：aria2c 内部重连 + 外层循环重试，抵抗 GitHub 503/EOF 抖动
          dl() {
            local url="$1" out="$2" tries="${3:-12}" i o
            for ((i=1;i<=tries;i++)); do
              echo ">> 下载尝试 $i/$tries : $out"
              if aria2c --max-tries=0 --retry-wait=6 --connect-timeout=30 --timeout=120 -s16 -x16 -k1M "$url" -o "$out"; then
                [ -f "$out" ] && [ -s "$out" ] && echo ">> 下载成功: $out" && return 0
              fi
              echo ">> $out 下载失败(可能503/EOF), 5秒后重试..."
              rm -f "$out"
              sleep 5
            done
            echo ">> ★ 多次重试后仍失败: $out" >&2
            return 1
          }

          echo "正在克隆源码仓库..."
          dl "https://github.com/cctv18/android_kernel_common_oneplus_sm8750/archive/refs/heads/oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118.zip" common.zip &
          PID1=$!

          echo "正在克隆llvm-clang18工具链..."
          mkdir -p clang18
          dl "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip" clang.zip &
          PID2=$!

          echo "正在克隆构建工具..."
          dl "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip" build-tools.zip &
          PID3=$!

          # 等所有下载完成；任何一个失败则整体失败
          wait $PID1 $PID2 $PID3
          echo ">> 三个包下载全部完成，开始解压"
          unzip -q common.zip
          mv "android_kernel_common_oneplus_sm8750-oneplus-sm8750_b_16.0.0_oneplus_13_6.6.118" common
          rm -rf common.zip
          unzip -q clang.zip -d clang18
          rm -rf clang.zip
          unzip -q build-tools.zip
          rm -rf build-tools.zip
          echo "所有源码及工具链初始化完成！"
          # 去除 ABI 保护 & 去除 dirty 后缀
          rm common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      # 3. 配置内核（缓存命中时自动跳过）—— 使用设备真实 config（含正确 LOCALVERSION 与 MODULE_SIG_ALL/SHA1，确保 .ko 的 module_layout 等符号 CRC 精确匹配设备内核）
      - name: 配置内核（设备真实 config）
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/build-tools/bin:$PATH"
          cd kernel_workspace/common
          # 直接用设备真实 .config 作为编译配置源（保证所有符号 CRC 与设备内核一致）
          mkdir -p out
          cp -f $GITHUB_WORKSPACE/device_config.txt out/.config
          # olddefconfig：将过时/缺失项按 kconfig 默认补齐并归一化到正确格式
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out olddefconfig
          echo "=== 确认关键配置项 ==="
          grep -E 'CONFIG_LOCALVERSION=|CONFIG_MODULE_SIG_ALL|CONFIG_MODULE_SIG_SHA1|CONFIG_MODULE_SIG_HASH|CONFIG_MODULE_SIG=|CONFIG_MODULES=' out/.config

      # 4. 编译完整 GKI 内核（缓存命中时自动跳过；生成 out/Module.symvers 确保 .ko 符号匹配）
      - name: 编译内核
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/build-tools/bin:$PATH"
          cd kernel_workspace/common
          # 编译内核镜像
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          # 内核构建实际把导出符号写进了 vmlinux.symvers，
          # 编译外部模块（M=...）时 modpost 读的是 out/Module.symvers，
          # 故将 vmlinux.symvers 复制为 Module.symvers（含全部内核导出符号+CRC，CFI 环境必需）。
          cp -f out/vmlinux.symvers out/Module.symvers
          echo "=== 确认 Module.symvers 已生成 ==="
          ls -la out/vmlinux.symvers out/Module.symvers 2>&1
          echo "=== DIAG: Module.symvers 中 module_layout 与其他关键符号 CRC ==="
          grep -E 'module_layout|__this_module|MODULE_SIG|misc_register' out/Module.symvers 2>&1 | head -20
          echo "=== DIAG: Module.symvers module_layout 行 ==="
          grep -F 'module_layout' out/Module.symvers 2>&1

      # 5. 保存缓存（仅在本次真正编译过硬核后保存/更新）
      - name: 保存缓存
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel_workspace
          key: pte-cache-${{ env.CCACHE_KEY }}

      # 6. 编译 pte_driver 独立模块 (.ko) —— 每次都会执行
      # 关键：M= 模块目录必须放在内核树(kernel_workspace/common)之外，
      #       否则 kbuild 无法为 .ko 生成链接规则，报 "No rule to make target X.ko"
      - name: 编译 pte_driver 独立模块 (.ko)
        run: |
          echo "=== 准备模块编译环境 ==="
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/build-tools/build-tools/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          COMMON=$GITHUB_WORKSPACE/kernel_workspace/common
          OUT=$COMMON/out
          # 预生成 out/scripts/module.lds（缓存=make Image 产物不含它，缺失会让 %.ko 链接规则失配）
          make -C $COMMON LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld KCFLAGS+=-O2 KCFLAGS+=-Wno-error O=out scripts/module.lds 2>&1 | tail -5
          ls -la $OUT/scripts/module.lds 2>&1 || echo "module.lds 仍缺失"
          # 关键：把模块源码放进 out(objtree) 树内部，使 $(obj) 与 M 绝对路径在 O= 分离构建下一致，
          #       从而 MODPOST 生成的 .mod.c 与 modfinal 链接所在的 $(obj) 不错位，%.ko 规则才能命中。
          rm -rf $OUT/pte_driver_mod
          cp -r $GITHUB_WORKSPACE/pte_driver $OUT/pte_driver_mod
          rm -f $OUT/pte_driver_mod/*.o $OUT/pte_driver_mod/*.ko $OUT/pte_driver_mod/*.mod* $OUT/pte_driver_mod/.*.cmd 2>/dev/null || true
          echo "M 模块目录(在 out 内): $OUT/pte_driver_mod"
          echo "=== 编译 pte_driver.ko ==="
          make -C $COMMON LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld KCFLAGS+=-O2 KCFLAGS+=-Wno-error O=out M=$OUT/pte_driver_mod modules > /tmp/mod_build.log 2>&1
          MAKE_RC=$?
          echo "#### make return code = $MAKE_RC ####"
          echo "===== make 输出(尾部200) ====="
          tail -200 /tmp/mod_build.log
          echo "===== 查找 .ko ====="
          find $OUT/pte_driver_mod -name '*.ko' -exec ls -la {} \; 2>&1
          echo "===== .mod.c/.mod.o 位置 ====="
          find $OUT/pte_driver_mod -name '*.mod*' 2>&1 | head
          # 复制产物到工作区根下的 artifacts 子目录（供 upload-artifact 可靠匹配）
          mkdir -p $GITHUB_WORKSPACE/artifacts
          find $OUT/pte_driver_mod -name 'pte_driver.ko' -exec cp -f {} $GITHUB_WORKSPACE/artifacts/ \; 2>/dev/null || true
          echo "===== DIAG: 清空 __versions 段(复刻paradise: 内核跳过符号版本校验) ====="
          python3 - <<'PYEOF'
          import struct
          p='/home/runner/work/pte_driver_ko/pte_driver_ko/artifacts/pte_driver.ko'
          d=bytearray(open(p,'rb').read())
          shoff=struct.unpack_from('<Q',d,0x28)[0]; she=struct.unpack_from('<H',d,0x3a)[0]
          shn=struct.unpack_from('<H',d,0x3c)[0]; shx=struct.unpack_from('<H',d,0x3e)[0]
          sso=struct.unpack_from('<Q',d,shoff+shx*she+0x18)[0]
          for i in range(shn):
              e=shoff+i*she; no=struct.unpack_from('<I',d,e)[0]
              ne=d.find(b'\0',sso+no); nm=d[sso+no:ne].decode()
              if nm=='__versions':
                  off=struct.unpack_from('<Q',d,e+0x18)[0]; sz=struct.unpack_from('<Q',d,e+0x20)[0]
                  struct.pack_into('<Q',d,e+0x20,0)
                  for j in range(off,off+sz): d[j]=0
                  print('cleared __versions',hex(off),'-> 0 SIZE='+str(sz)); break
          open(p,'wb').write(d)
          print('saved',p,len(d))
          PYEOF
          ls -la $GITHUB_WORKSPACE/artifacts/pte_driver.ko
          ls -la $GITHUB_WORKSPACE/artifacts/ 2>&1 || true
          echo "#### 最终 .ko 绝对路径: $GITHUB_WORKSPACE/artifacts/pte_driver.ko ####"
          echo "===== DIAG: .ko 里 module_layout CRC (对比 Module.symvers) 是否一致 ====="
          python3 - <<'PYEOF'
          import struct
          def read_versions(path):
              data=open(path,'rb').read()
              if not data.startswith(b'\x7fELF'): return {}
              shoff=struct.unpack_from('<Q',data,0x28)[0]
              shentsize=struct.unpack_from('<H',data,0x3a)[0]
              shnum=struct.unpack_from('<H',data,0x3c)[0]
              shstrndx=struct.unpack_from('<H',data,0x3e)[0]
              shstr_off=struct.unpack_from('<Q',data,shoff+shstrndx*shentsize+0x18)[0]
              shstr_size=struct.unpack_from('<Q',data,shoff+shstrndx*shentsize+0x20)[0]
              shstr=data[shstr_off:shstr_off+shstr_size]
              versions=None
              for i in range(shnum):
                  e=shoff+i*shentsize
                  no=struct.unpack_from('<I',data,e)[0]
                  nm=shstr[no:shstr.find(b'\0',no)].decode()
                  off=struct.unpack_from('<Q',data,e+0x18)[0]
                  size=struct.unpack_from('<Q',data,e+0x20)[0]
                  if nm=='__versions':
                      versions=data[off:off+size]; break
              out={}
              if versions:
                  for i in range(0,len(versions),64):
                      crc=struct.unpack_from('<Q',versions,i)[0]
                      name=versions[i+8:i+64].split(b'\0')[0].decode()
                      out[name]=hex(crc)
              return out
          ko='/home/runner/work/pte_driver_ko/pte_driver_ko/artifacts/pte_driver.ko'
          v=read_versions(ko)
          print('.ko module_layout CRC =', v.get('module_layout'))
          print('.ko misc_register CRC  =', v.get('misc_register'))
          import os
          sym='/home/runner/work/pte_driver_ko/pte_driver_ko/kernel_workspace/common/out/Module.symvers'
          if os.path.exists(sym):
              sl=(open(sym).read()+'\n').split('\n')
              for l in sl:
                  if 'module_layout' in l or 'misc_register' in l:
                      print('Module.symvers:', l[:120])
          else:
              print('Module.symvers NOT FOUND at', sym)
          PYEOF
          exit $MAKE_RC

      # 7. 上传 pte_driver.ko
      - name: 上传 pte_driver.ko
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pte_driver_ko
          path: artifacts/
          if-no-files-found: warn
